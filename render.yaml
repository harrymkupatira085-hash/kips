services:
  - type: web
    name: kips-restaurant
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api.php?action=status
    autoDeploy: true
    disk:
      name: kips-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KIPS_DATA_DIR
        value: /var/data
